<style>

body{margin:0}

#detail{background:var(--surface-2);border-radius:8px;padding:14px 16px;margin-top:10px;min-height:44px}
#detail details{margin-top:8px}
.gl{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:3px 14px}

.gl dd{margin:0;color:var(--text-secondary);font-size:15px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--text-secondary);margin:6px 0}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--text-secondary);font-weight:600;font-size:14px}
#keytable tr{cursor:pointer}#keytable tr:hover td{background:var(--surface-2)}
.nm2{font-weight:700}.meta2{color:var(--text-muted);font-size:12.5px}
#gpanel{background:var(--surface-2);border-radius:8px;padding:14px 16px;margin-top:10px;min-height:44px}
#gpanel li{margin:4px 0}
.gnode{cursor:pointer}
.ring{fill:none;stroke:var(--text-primary);stroke-width:2.5}
